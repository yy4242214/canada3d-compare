<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加拿大3D 双方案对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#1b2b42;font:15px system-ui,sans-serif}.wrap{max-width:940px;margin:auto;padding:12px}h1{font-size:21px;margin:10px 0 4px}.sub{color:#68768b;font-size:12px;margin:0 0 12px}.top{display:flex;gap:8px;justify-content:space-between;align-items:center}.btn{border:0;background:#1767c5;color:white;padding:9px 12px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.history{background:white;border-radius:12px;padding:12px;box-shadow:0 1px 5px #dfe5ee}.card h2{font-size:17px;margin:0 0 8px}.low{border-top:4px solid #b6651c}.high{border-top:4px solid #1767c5}.label{font-size:12px;color:#6a7889}.num{font-size:21px;font-weight:800;letter-spacing:1px}.row{border-bottom:1px solid #e9edf3;padding:7px 0}.row:last-child{border:0}.rate{font-size:19px;font-weight:800}.bad{color:#b33939}.good{color:#137b4b}.history{margin-top:12px}details summary{cursor:pointer;font-weight:650;padding:4px 0}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}td,th{padding:8px 7px;border-bottom:1px solid #e8edf4;text-align:left}th{background:#f4f7fb}.muted{font-size:12px;color:#68768b}.alert{color:#b33939;font-size:12px;overflow-wrap:anywhere}@media(max-width:600px){.wrap{padding:9px}.card{padding:9px}.card h2{font-size:15px}.num{font-size:18px}.rate{font-size:17px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>加拿大3D｜双方案对照</h1><p class="sub" id="updated">读取数据中…</p></div><button class="btn" onclick="refresh()">刷新</button></div><div class="grid"><section class="card low" id="low"><h2>方案A · 历史最低</h2>读取中…</section><section class="card high" id="high"><h2>方案B · 历史最高</h2>读取中…</section></div><section class="history"><details><summary>逐期真实验证记录（展开）</summary><div class="scroll" id="history">暂无</div></details></section><p class="muted">每个位置排除3个不同数字，剩余343注。历史回测不等于前瞻验证。云端计划每5分钟尝试更新，实际运行可能延迟或暂停；网页刷新不触发服务器计算。</p></div><script>
const POS=['百位','十位','个位'];const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\"':'&quot;'}[c]));
function card(name,j){let sel=j.selection||{},s=j.stats||{},recs=j.records||[],p=recs.find(x=>x.actual===null),e=p?.excluded||{},a=p?.allowed||{};
let rows=POS.map(pos=>`<div class="row"><div class="label">${pos}排除</div><div class="num">${(e[pos]||[]).join('、')||'待预测'}</div><div class="muted">保留 ${(a[pos]||[]).join(' ')||'—'}</div></div>`).join('');
let pairs=POS.map(pos=>`<div class="muted">${pos}：${esc((sel.pairs?.[pos]||[]).join(' + '))}</div>`).join('');
return `<h2>${name}</h2><div class="label">下一期 ${esc(p?.issue)} ｜ ${p?'343注':'等待生成'}</div>${rows}<div class="row"><span class="label">真实覆盖</span> <span class="rate">${s.hits??0}/${s.settled??0}（${s.rate??'—'}%）</span><div class="muted">最长连续未覆盖 ${s.longest_miss??0} 期 ｜ 当前 ${s.current_miss??0} 期</div></div><div class="row"><div class="muted">历史回测：${sel.hits??'—'}/${sel.total??'—'} ｜ 待核对 ${s.pending??0} 期</div><div class="muted">预测保存时间：${esc(p?.created_at)}</div>${j.last_error?`<div class="alert">错误：${esc(j.last_error)}</div>`:''}</div><details><summary class="muted">查看固定方法与撞号补位</summary>${pairs}<hr><div class="muted">本期实际方法：</div>${POS.map(pos=>`<div class="muted">${pos}：${esc((p?.sources?.[pos]||[]).join(' + '))}</div>`).join('')}</details>`}
function result(r){return !r?'—':r.actual===null?'待开奖':r.covered?'覆盖':'未覆盖'}
async function refresh(){try{let t=Date.now(),[la,ha,he]=await Promise.all(['low_view.json','high_view.json','health.json'].map(x=>fetch('data/'+x+'?t='+t,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.json()})));document.getElementById('low').innerHTML=card('方案A · 历史最低',la);document.getElementById('high').innerHTML=card('方案B · 历史最高',ha);document.getElementById('updated').textContent='最近云端执行：'+(he.updated_at||'—')+'（UTC）';let a=new Map((la.records||[]).map(x=>[x.issue,x])),b=new Map((ha.records||[]).map(x=>[x.issue,x]));let keys=[...new Set([...a.keys(),...b.keys()])].sort((x,y)=>Number(y)-Number(x)).slice(0,100);document.getElementById('history').innerHTML='<table><thead><tr><th>期号</th><th>开奖号码</th><th>A排除百/十/个</th><th>A结果</th><th>B排除百/十/个</th><th>B结果</th></tr></thead><tbody>'+keys.map(k=>{let x=a.get(k),y=b.get(k);let fmt=z=>z?POS.map(p=>(z.excluded?.[p]||[]).join('')).join('/'):'—';return `<tr><td>${esc(k)}</td><td>${esc(x?.actual||y?.actual||'待开奖')}</td><td>${esc(fmt(x))}</td><td>${result(x)}</td><td>${esc(fmt(y))}</td><td>${result(y)}</td></tr>`}).join('')+'</tbody></table>'}catch(e){document.getElementById('updated').textContent='数据暂不可用：'+e.message}}
refresh();setInterval(refresh,60000);
</script></body></html>
